 h+='<div class="card" style="border-left:5px solid #2e7d32"><h3>'+t('secA')+'</h3>'+ex('goods')+photoBlock('g_'+v.idx,t('goods'),1,false,(v.answers['g_'+v.idx]||{}).photoIds)+'<label class="small" style="display:block;margin-top:8px">'+t('actual')+'</label>'+num('actual',it.actual,1)+'</div>';
 h+='<div class="card" style="border-left:5px solid #1565c0"><h3>'+t('secB')+'</h3>'+ex('pos')+photoBlock('p_'+v.idx,t('posphoto'),1,false,(v.answers['p_'+v.idx]||{}).photoIds)+'<label class="small" style="display:block;margin-top:8px">'+t('posqty')+'</label>'+num('pos',it.pos,1)+'</div>';
 if(it.actual!==''&&it.actual!=null&&it.pos!==''&&it.pos!=null){var d=Number(it.actual)-Number(it.pos);h+='<div class="card"><div class="'+(d?'warn':'ok')+'" style="font-size:17px"><b>'+t('diff')+'（A − B）: '+(d>0?'+':'')+d+'</b></div>';
  if(d){h+='<label class="small" style="display:block;margin:8px 0 4px">'+(L==='zh'?'5. 差异原因（选一个）':'5. Penyebab selisih (pilih satu)')+'</label>'+spotRs(it).map(function(o,k){return '<div class="opt'+(it.reason===o[1]?' sel':'')+'" onclick="spotSetR('+k+')"><span>'+tt(o)+'</span><span>'+(it.reason===o[1]?'✓':'')+'</span></div>';}).join('');}
  h+='</div>';}
 var g=(v.answers['g_'+v.idx]||{}).photoIds||[],p=(v.answers['p_'+v.idx]||{}).photoIds||[];
  return h+'<div class="row"><button class="btn btn2" onclick="spotGo(-1)">'+t('back')+'</button><button class="btn" onclick="spotGo(1)">'+t('next')+'</button></div>';}
function spotGuide(){var zh=L==='zh',n=(S.v.items||[]).length,im=function(src,w){return '<img src="'+src+'" style="width:'+(w||100)+'%;border-radius:6px;border:1px solid #ddd;margin-top:6px;display:block">';},
 step=function(c,title,txt,img){return '<div style="border-left:4px solid '+c+';padding:2px 0 2px 10px;margin-top:12px"><b>'+title+'</b><div class="small" style="margin-top:2px">'+txt+'</div>'+img+'</div>';};
 return '<div class="card"><h2 style="margin-bottom:2px">'+(zh?'抽检怎么做':'Cara stock opname')+'</h2><div class="small muted">'+(zh?'共 '+n+' 个 SKU，每个都一样：拍 2 张照片、填 2 个数字。':'Total '+n+' SKU, semuanya sama: 2 foto + 2 angka.')+'</div>'
 +step('#2e7d32',zh?'① 拍实物（要拍）':'① Foto barang (wajib)',zh?'库存全部摆一起、正面朝前，看得清名字和数量 → 填实际点数。':'Jajarkan semua stok, sisi depan ke kamera, nama & jumlah jelas → isi jumlah hitungan.',im('img/ex-goods.jpg',80))
 +step('#9e9e9e',zh?'② 打开 LK POS 查库存（不用拍）':'② Buka cek stok LK POS (tidak difoto)',zh?'Inventory Management → 第一个「Inventory inquiry」→ 搜索这个产品。':'Inventory Management → menu pertama "Inventory inquiry" → cari produk ini.',im('img/ex-pos-menu.jpg',60))
 +step('#1565c0',zh?'③ 拍 POS 这一行（要拍）':'③ Foto baris di POS (wajib)',zh?'拍到产品名、条码和 In stock → 填 POS 数量。':'Nama produk, barcode & In stock terlihat → isi angka POS.',im('img/ex-pos.jpg',100))
 +'</div><button class="btn" onclick="S.v.guideSeen=1;saveDraft();render();window.scrollTo(0,0)">'+(zh?'我知道了，开始抽检':'Mengerti, mulai')+'</button>';}
var SPOT_LESS=[['Terjual tapi belum diinput di POS','卖了没录单'],['Salah input penjualan (produk atau jumlah)','销售单录错（商品或数量）'],['Sudah dicari tapi tidak ketemu (kemungkinan hilang)','找遍了还是找不到（疑似丢失）'],['Sudah ditransfer ke toko lain, belum diinput keluar di sistem','已调拨到别的门店，系统还没录出库'],['Sudah dikembalikan ke gudang, belum diinput keluar di sistem','已退回仓库，系统还没录出库'],['Penyebab tidak diketahui','原因不明']],
SPOT_MORE=[['Salah input penjualan (produk atau jumlah)','销售单录错（商品或数量）'],['Kiriman dari gudang sudah sampai, belum klik terima di sistem','仓库补货已到店，系统里没点接收'],['Transfer dari toko lain sudah sampai, belum klik terima di sistem','别的门店调拨来的货已到店，系统里没点接收'],['Penyebab tidak diketahui','原因不明']];
function spotRs(i){return Number(i.actual)<Number(i.pos)?SPOT_LESS:SPOT_MORE;}
function spotWhy(i){if(!i.reason)return false;if(!spotRs(i).some(function(o){return o[1]===i.reason}))return false;return true;}
function spotNote(i){return Number(i.actual)===Number(i.pos)?'':(i.reason||'');}
function spotNoteTr(n){if(L==='zh'||!n)return n;var a=SPOT_LESS.concat(SPOT_MORE);for(var k=0;k<a.length;k++){if(n.indexOf(a[k][1])===0)return a[k][0]+n.slice(a[k][1].length).replace(/^：/,': ');}return n;}
function spotSetR(k){var i=S.v.items[S.v.idx];i.reason=spotRs(i)[k][1];saveDraft();render();}
function spotDone(k){var v=S.v,i=v.items[k],g=(v.answers['g_'+k]||{}).photoIds||[],p=(v.answers['p_'+k]||{}).photoIds||[];return !!(g.length&&p.length&&i.actual!==''&&i.actual!=null&&i.pos!==''&&i.pos!=null&&(Number(i.actual)===Number(i.pos)||spotWhy(i)));}

function spotGo(d){S.v.idx=Math.max(0,Math.min(S.v.items.length,S.v.idx+d));saveDraft();render();window.scrollTo(0,0);}
function spotEnd(){var v=S.v,miss=v.items.map(function(x,k){return k}).filter(function(k){return !spotDone(k)}),same=v.items.filter(function(i){return Number(i.actual)===Number(i.pos)}).length;

 h+='<div class="card">'+photoBlock('outselfie',t('outselfie'),1,true,v.endSelfieIds)+'<div class="small" style="margin-top:8px">'+geoLine()+'</div></div>';var n=pending();h+=upBox();

 return spotGrid()+h+'<button id="subBtn" class="btn" '+((v.endSelfieIds||[]).length&&!n&&!miss.length?'':'disabled')+' onclick="submitSpot()">'+(L==='zh'?'提交抽检结果':'Kirim hasil cek stok')+'</button><button class="btn btn2" onclick="spotGo(-1)">'+t('back')+'</button>';}

 var p={visitId:v.visitId,storeId:v.storeId,startTime:v.startTime,startDist:v.startDist,startGeo:v.startGeo||null,endGeo:v.endGeo||null,startSelfie:(v.startSelfieIds||[]).map(murl).join('\n'),endSelfie:(v.endSelfieIds||[]).map(murl).join('\n'),
