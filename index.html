// ================= state =================

var DRAFT_KEY='lk_draft_v1';
function saveDraft(){if(S.v){localStorage.setItem(DRAFT_KEY,JSON.stringify(S.v));}setSync();}
function loadDraft(){try{return JSON.parse(localStorage.getItem(DRAFT_KEY)||'null');}catch(e){return null;}}

function toast(m){var e=document.getElementById('toast');e.textContent=m;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(function(){e.style.display='none'},2600);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]});}
function busyOn(m){document.getElementById('busymsg').textContent=m;document.getElementById('busy').style.display='flex';}
function busyOff(){document.getElementById('busy').style.display='none';}
var API='https://script.google.com/macros/s/AKfycbxPxspsZC9VBAmycgwoYaAdzPRe_t3LzAP9js9Aon7GgJNAtoAmdg4KShmHbCPGl0I/exec';
function run(fn,args,ok,fail){var onFail=function(e){if(String(e).indexOf('SESSION_EXPIRED')>=0){toast(t('expired'));logout();return;}(fail||function(){toast(t('err'))})(e);};
 if(window.google&&google.script&&google.script.run){var r=google.script.run.withSuccessHandler(ok).withFailureHandler(onFail);r[fn].apply(r,args);return;}
 fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args})})
  .then(function(x){return x.json()}).then(function(j){if(j.err)onFail(j.err);else ok(j.data);}).catch(onFail);}
var OFF=0;function nowStr(){var d=new Date(Date.now()+OFF);function p(n){return(n<10?'0':'')+n}return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());}

var DB;function idb(cb){if(DB)return cb(DB);var r=indexedDB.open('lkcheck',1);r.onupgradeneeded=function(){r.result.createObjectStore('m')};r.onsuccess=function(){DB=r.result;cb(DB)};}
function mput(id,val){idb(function(db){db.transaction('m','readwrite').objectStore('m').put(val,id)});}
function mget(id,cb){idb(function(db){var q=db.transaction('m').objectStore('m').get(id);q.onsuccess=function(){cb(q.result)}})}
function mdel(id){idb(function(db){db.transaction('m','readwrite').objectStore('m').delete(id)})}
// media registry in draft: S.v.media[id]={name,mime,url}
var busy=false;
function pump(){if(busy||!S.v||!S.token||!S.v.visitId){setSync();return;}var ids=Object.keys(S.v.media).filter(function(k){return !S.v.media[k].url});setSync();if(!ids.length)return;busy=true;var id=ids[0],m=S.v.media[id];
 mget(id,function(data){if(!data){delete S.v.media[id];busy=false;saveDraft();return pump();}
  run('uploadFile',[S.token,S.v.visitId,m.name,m.mime,data.split(',')[1]],function(res){S.v.media[id].url=res.url;mdel(id);busy=false;saveDraft();pump();},
   function(){busy=false;setTimeout(pump,15000);});});}
setInterval(pump,20000);
function pending(){return S.v?Object.keys(S.v.media).filter(function(k){return !S.v.media[k].url}).length:0;}
function setSync(){var e=document.getElementById('sync');if(!e)return;var n=pending();e.innerHTML=S.v?(n?'<span class="warn">⟳ '+(S.v.visitId?t('uploading'):t('waitCheckin'))+' '+n+'</span>':'<span class="ok">✓ '+t('saved')+'</span>'):'';}
function murl(id){return S.v&&S.v.media[id]?S.v.media[id].url||'':'';}

function getGeo(cb){if(!navigator.geolocation)return cb(null);var done=false;navigator.geolocation.getCurrentPosition(function(p){if(done)return;done=true;cb({lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy)})},function(){if(done)return;done=true;cb(null)},{enableHighAccuracy:true,timeout:12000,maximumAge:30000});setTimeout(function(){if(!done){done=true;cb(null)}},14000);}

 var g=/^([gp])_(\d+)$/.exec(k);if(g&&S.v&&S.v.items){var it=S.v.items[+g[2]]||{};return (g[1]==='g'?(zh?'货品 ':'Barang '):'POS ')+(it.sku||'')+' '+(it.name||'');}
 var it=S.boot&&S.boot.items?S.boot.items.find(function(i){return i.code===k}):null;return it?k+' '+f(it,'title'):k;}

 return '⚠️ '+(L==='zh'?'没拿到定位。请允许浏览器使用位置，然后 ':'Lokasi belum terbaca. Izinkan akses lokasi di browser, lalu ')+'<a href="#" onclick="askGeo();return false">'+(L==='zh'?'点这里重试':'coba lagi')+'</a>';}

function takePhoto(tag,front,cb){var inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.setAttribute('capture',front?'user':'environment');
 inp.onchange=function(){var file=inp.files[0];if(!file)return;if(file.lastModified&&Date.now()-file.lastModified>5*60000){toast(t('photoOld'));return;}
  var img=new Image();img.onload=function(){var max=1280,w=img.width,h=img.height,r=Math.min(1,max/Math.max(w,h));w=Math.round(w*r);h=Math.round(h*r);
   var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');x.drawImage(img,0,0,w,h);
   var g=S.lastGeo,lines=[nowStr(),(S.v?S.v.storeId+' '+(S.v.storeName||''):''),(S.user?S.user.nick:'')+' · '+tagLabel(tag),g?('GPS '+g.lat.toFixed(5)+', '+g.lng.toFixed(5)):'GPS -'];
   var fs=Math.max(16,Math.round(w/40));x.font='bold '+fs+'px Arial';var bh=(fs+6)*lines.length+10;x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,h-bh,w,bh);x.fillStyle='#FDCD17';
   lines.forEach(function(l,i){x.fillText(l,10,h-bh+fs+6+i*(fs+6))});
   var data=c.toDataURL('image/jpeg',0.72);var id='p'+Date.now()+Math.floor(Math.random()*1000);
   mput(id,data);S.v.media[id]={name:tag.replace(/[^\w.-]+/g,'_')+'_'+id+'.jpg',mime:'image/jpeg'};S.thumbs[id]=data;saveDraft();pump();cb(id);};
  img.src=URL.createObjectURL(file);};
 getGeo(function(g){if(g)S.lastGeo=g;});inp.click();}

var REC=null;
function recUI(key,min,max){var r=S.v.rec[key]||{};var html='<div class="card"><h3>'+t(key)+'</h3>';
 if(r.id&&!REC)html+='<div class="ok">✓ '+t('recok')+' ('+Math.round(r.sec/60*10)/10+' '+t('minutes')+')</div><button class="btn btn2" onclick="recStart(\''+key+'\','+min+','+max+')">'+t('retake')+'</button>';
 else if(REC&&REC.key===key)html+='<div class="rec" id="rtime">0:00</div><div class="row"><button class="btn btn2" onclick="recPause()" id="rpause">'+t('pause')+'</button><button class="btn" onclick="recStop()">'+t('stop')+'</button></div>';
 else html+='<button class="btn btnY" onclick="recStart(\''+key+'\','+min+','+max+')">● '+t('start')+'</button>';
 return html+'</div>';}
function recStart(key,min,max){navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){var mr=new MediaRecorder(st);var ch=[];mr.ondataavailable=function(e){ch.push(e.data)};
 REC={key:key,mr:mr,st:st,ch:ch,min:min,max:max,sec:0,paused:false};mr.start(1000);
 REC.timer=setInterval(function(){if(!REC.paused)REC.sec++;var e=document.getElementById('rtime');if(e)e.textContent=Math.floor(REC.sec/60)+':'+('0'+REC.sec%60).slice(-2);if(REC.sec>=REC.max*60)recStop(true);},1000);
 mr.onstop=function(){var b=new Blob(ch,{type:mr.mimeType||'audio/webm'});var fr=new FileReader();fr.onload=function(){var id='a'+Date.now();mput(id,fr.result);
  S.v.media[id]={name:key+'_'+id+'.webm',mime:b.type.split(';')[0]};S.v.rec[key]={id:id,sec:REC.sec};st.getTracks().forEach(function(tk){tk.stop()});clearInterval(REC.timer);REC=null;saveDraft();pump();render();};fr.readAsDataURL(b);};
 render();}).catch(function(){toast(t('micfail'))});}
function recPause(){if(!REC)return;if(REC.paused){REC.mr.resume();REC.paused=false;document.getElementById('rpause').textContent=t('pause');}else{REC.mr.pause();REC.paused=true;document.getElementById('rpause').textContent=t('cont');}}
function recStop(force){if(!REC)return;if(!force&&REC.sec<REC.min*60){toast(t('tooshort')+' '+REC.min+' '+t('minutes'));return;}if(REC.paused)REC.mr.resume();REC.mr.stop();}

function std_s6(){var a=S.v.answers['B.8']=S.v.answers['B.8']||{};if(a.level==='NA')delete a.level;var g=b8Suggest();
 var tip=(L==='zh'?'根据第 2 步的核实结果，系统建议：<b>'+g.lv+'%</b>（断货没报补货 '+g.n1+' 个，不动销没上架/没价签 '+g.n2+' 个）。请确认后选择档位。':'Berdasarkan hasil cek di langkah 2, saran sistem: <b>'+g.lv+'%</b> (kosong belum minta restock: '+g.n1+', tidak laku belum dipajang/tanpa label: '+g.n2+'). Konfirmasi lalu pilih nilai.');
 return '<h2>'+tt(T.sec[6])+'</h2>'+itemCard('B.8','<div class="guide">'+tip+'</div>')+nav(codesDone(['B.8']));}
function cLow(){return ['C.0','C.1','C.3','C.4','C.5','C.6','C.7'].some(function(c){var l=(S.v.answers[c]||{}).level;return l&&l!=='NA'&&Number(l)<80});}
function std_s7(){var v=S.v,c=v.ctx,s=v.sales=v.sales||{};var a3=v.answers['C.3']=v.answers['C.3']||{};if(!a3.level)a3.level='NA';
 var h='<h2>'+t('sales')+'</h2><div class="guide">'+t('guide')+'</div><div class="card"><label class="small">'+t('staff')+'</label>';
 if(c.staff&&c.staff.length)h+='<select onchange="S.v.sales.staff=this.value;saveDraft()"><option value="">—</option>'+c.staff.map(function(n){return '<option'+(s.staff===n?' selected':'')+'>'+esc(n)+'</option>'}).join('')+'</select>';
 else h+='<input placeholder="'+t('staffname')+'" value="'+esc(s.staff||'')+'" oninput="S.v.sales.staff=this.value;saveDraft()">';
 h+='<div class="q">'+t('learnedQ')+'</div><div class="row">'+T.learnedA.map(function(o){return '<div class="opt'+(s.learned===o[1]?' sel':'')+'" onclick="S.v.sales.learned=\''+o[1]+'\';saveDraft();render()">'+tt(o)+'</div>'}).join('')+'</div>';
 if(s.learned&&s.learned!=='都学过')h+='<div class="row" style="flex-wrap:wrap">'+T.gaps.map(function(o){var on=(s.gaps||[]).indexOf(o[1])>=0;return '<div class="opt'+(on?' sel':'')+'" onclick="togGap(\''+o[1]+'\')">'+tt(o)+'</div>'}).join('')+'</div>';
 h+='</div><div class="guide">'+t('roleplayTip')+'</div>'+recUI('rec1',3,10);
 h+=itemCard('C.1')+itemCard('C.3','<div class="guide">'+t('c3na')+'</div>')+itemCard('C.4')+itemCard('C.5')+itemCard('C.7');
 h+='<div class="card"><h3>'+t('quiz')+'</h3>'+(c.quiz||[]).map(function(q){return '<div class="q">'+esc(L==='zh'?q.q_zh:q.q_id)+'<div class="ans">'+t('answer')+': '+esc(L==='zh'?q.a_zh:q.a_id)+'</div></div>'}).join('')+'</div>'+recUI('rec2',1,5)+itemCard('C.6');
 h+='<div class="card">'+photoBlock('group',t('groupphoto'),1,false,v.groupIds)+'<textarea placeholder="'+t('comment')+'" oninput="S.v.sales.comment=this.value;saveDraft()">'+esc(s.comment||'')+'</textarea></div>';
 if(cLow()){h+='<div class="card" style="border:2px solid #b26a00"><h3>'+t('coach')+'</h3><div class="small">'+t('coachWhy')+'</div><div class="row" style="flex-wrap:wrap">'+T.topics.map(function(o){var on=(s.coachTopics||[]).indexOf(o[1])>=0;return '<div class="opt'+(on?' sel':'')+'" onclick="togTopic(\''+o[1]+'\')">'+tt(o)+'</div>'}).join('')+'</div></div>'+recUI('rec3',3,15)+
  '<div class="card"><b>'+t('after')+'</b><div class="row">'+T.afterA.map(function(o){return '<div class="opt'+(s.coachResult===o[1]?' sel':'')+'" onclick="S.v.sales.coachResult=\''+o[1]+'\';saveDraft();render()">'+tt(o)+'</div>'}).join('')+'</div></div>';}
 var ok=s.staff&&s.learned&&v.rec.rec1&&v.rec.rec2&&codesDone(['C.1','C.3','C.4','C.5','C.6','C.7'])&&(v.groupIds||[]).length&&(s.comment||'').trim().length>=20;
 if(cLow())ok=ok&&(s.coachTopics||[]).length&&v.rec.rec3&&s.coachResult;
 return h+nav(ok);}
function togGap(g){var s=S.v.sales;s.gaps=s.gaps||[];var i=s.gaps.indexOf(g);i<0?s.gaps.push(g):s.gaps.splice(i,1);saveDraft();render();}
function togTopic(g){var s=S.v.sales;s.coachTopics=s.coachTopics||[];var i=s.coachTopics.indexOf(g);i<0?s.coachTopics.push(g):s.coachTopics.splice(i,1);saveDraft();render();}
function std_s8(){var cs=['D.1','D.2','D.3','D.6'];return '<h2>'+tt(T.sec[8])+'</h2>'+cs.map(function(c){return itemCard(c)}).join('')+nav(codesDone(cs));}
function failing(){return S.boot.items.filter(function(it){var a=S.v.answers[it.code];return a&&a.level&&a.level!=='NA'&&a.level!=='100'});}
function std_s9(){var v=S.v;v.fix=v.fix||{};var h='<h2>'+t('summary')+'</h2>';
 failing().forEach(function(it){var x=v.fix[it.code]=v.fix[it.code]||{};h+='<div class="card"><b>'+it.code+' '+esc(f(it,'title'))+'</b> <span class="tag">'+v.answers[it.code].level+'%</span><div class="small">'+esc(v.answers[it.code].note||'')+'</div><div class="row">'+
  '<div class="opt'+(x.action==='solved'?' sel':'')+'" onclick="S.v.fix[\''+it.code+'\'].action=\'solved\';saveDraft();render()">'+t('solved')+'</div><div class="opt'+(x.action==='rectify'?' sel':'')+'" onclick="S.v.fix[\''+it.code+'\'].action=\'rectify\';saveDraft();render()">'+t('rectify')+'</div></div>';
  if(x.action==='solved')h+=photoBlock('fix_'+it.code,t('solved'),1,false,(v.answers['fix_'+it.code]||{}).photoIds);
  if(x.action==='rectify')h+='<input placeholder="'+t('owner')+'" value="'+esc(x.owner||'')+'" oninput="S.v.fix[\''+it.code+'\'].owner=this.value;saveDraft()"><input type="date" value="'+esc(x.due||'')+'" oninput="S.v.fix[\''+it.code+'\'].due=this.value;saveDraft()">';
  h+='</div>';});
 h+='<div class="card"><textarea placeholder="'+t('helped')+'" oninput="S.v.helped=this.value;saveDraft()">'+esc(v.helped||'')+'</textarea><input placeholder="'+t('confirm')+'" value="'+esc(v.staffConfirm||'')+'" oninput="S.v.staffConfirm=this.value;saveDraft()"></div>';
 var ok=failing().every(function(it){var x=v.fix[it.code]||{};return x.action==='rectify'?(x.owner&&x.due):x.action==='solved'?((v.answers['fix_'+it.code]||{}).photoIds||[]).length:false})&&(v.helped||'').trim()&&(v.staffConfirm||'').trim();
 return h+nav(ok);}
function std_s10(){var v=S.v;var h='<h2>'+t('checkout')+'</h2><div class="card">'+photoBlock('outselfie',t('outselfie'),1,true,v.endSelfieIds)+'<div class="small" style="margin-top:8px">'+geoLine()+'</div></div>';
 var n=pending();if(n)h+='<div class="card warn">'+t('waitUp')+' ('+n+')</div>';
 h+='<button class="btn" '+((v.endSelfieIds||[]).length&&!n?'':'disabled')+' onclick="submitStd()">'+t('submit')+'</button><button class="btn btn2" onclick="go(-1)">'+t('back')+'</button>';return h;}
function mins(){return (Date.now()+OFF-new Date(S.v.startTime.replace(' ','T')))/60000;}
function submitStd(){var v=S.v;if(pending())return toast(t('waitUp'));if(mins()<30&&!confirm(t('minTime')))return;
 var ans={};Object.keys(v.answers).forEach(function(k){if(k.indexOf('fix_')===0)return;var a=v.answers[k];ans[k]={level:a.level,note:(a.skipPhoto?'['+(item(k)?f(item(k),'skip'):'skip')+'] ':'')+(a.note||''),red:!!a.red,photos:(a.photoIds||[]).map(murl)};});
 var cs=['C.0','C.1','C.3','C.4','C.5','C.6','C.7'],e=0,p=0;cs.forEach(function(c){var a=v.answers[c];if(a&&a.level&&a.level!=='NA'){var pts=Number(item(c).pts);e+=pts*Number(a.level)/100;p+=pts;}});
 var s=v.sales||{};
 var payload={visitId:v.visitId,storeId:v.storeId,startTime:v.startTime,startGeo:v.startGeo||null,startDist:v.startDist,startSelfie:(v.startSelfieIds||[]).map(murl).concat((v.frontIds||[]).map(murl)).join('\n'),
  endGeo:v.endGeo||null,endSelfie:(v.endSelfieIds||[]).map(murl).join('\n'),answers:ans,hints:v.ctx.hints,openIssues:v.ctx.openIssues.map(function(o){return {issueId:o.issueId,result:o.result}}),
  sales:{staff:s.staff,learned:s.learned,gaps:s.gaps||[],quiz:v.ctx.quiz,rec1:murl((v.rec.rec1||{}).id),rec2:murl((v.rec.rec2||{}).id),rec3:murl((v.rec.rec3||{}).id),coached:cLow(),coachTopics:s.coachTopics||[],coachResult:s.coachResult||'',comment:s.comment,groupPhoto:(v.groupIds||[]).map(murl).join('\n'),cTotal:p?e/p*100:undefined},
  issues:failing().map(function(it){var x=v.fix[it.code]||{};return {code:it.code,desc:(v.answers[it.code].note||''),action:x.action,owner:x.owner||'',due:x.due||'',photo:((v.answers['fix_'+it.code]||{}).photoIds||[]).map(murl).join('\n')}}),
  helped:v.helped,staffConfirm:v.staffConfirm,lang:L};
 busyOn(t('submitting'));run('submitStd',[S.token,payload],function(r){busyOff();localStorage.removeItem(DRAFT_KEY);S.v=null;document.getElementById('app').innerHTML='<div class="card"><h2>✓ '+t('done')+'</h2><div>'+t('score')+': <b>'+r.total+'</b> · '+esc(r.grade)+'</div><div class="small">'+Math.round(r.minutes)+' '+t('minutes')+(r.flags&&r.flags.length?' · <span class="warn">'+esc(r.flags.join(', '))+'</span>':'')+'</div><button class="btn" onclick="render()">'+t('home')+'</button></div>';},function(e){busyOff();toast(t('err')+': '+e);});}

// ---------- SPOT check ----------
function scSpot(){var v=S.v;if(!v.visitId)return scCheckin();
 if(!v.items.length)return '<div class="card">'+t('nosku')+'</div><button class="btn btn2" onclick="S.v=null;localStorage.removeItem(DRAFT_KEY);render()">'+t('home')+'</button>';
 if(v.idx>=v.items.length)return spotEnd();
 var it=v.items[v.idx],n=v.items.length,h='<div class="top"><span>'+t('sku')+' '+(v.idx+1)+'/'+n+'</span><span>'+esc(v.storeName||v.storeId)+'</span></div><div class="bar"><i style="width:'+((v.idx+1)/n*100)+'%"></i></div>';
 h+='<div class="card"><h3>'+esc(it.name)+'</h3><div class="muted">'+esc(it.sku)+'</div>';
 h+=photoBlock('g_'+v.idx,t('goods'),1,false,(v.answers['g_'+v.idx]||{}).photoIds);
 h+='<label class="small">'+t('actual')+'</label><input type="number" inputmode="numeric" value="'+esc(it.actual==null?'':it.actual)+'" oninput="S.v.items['+v.idx+'].actual=this.value;saveDraft()">';
 h+=photoBlock('p_'+v.idx,t('posphoto'),1,false,(v.answers['p_'+v.idx]||{}).photoIds);
 h+='<label class="small">'+t('posqty')+'</label><input type="number" inputmode="numeric" value="'+esc(it.pos==null?'':it.pos)+'" oninput="S.v.items['+v.idx+'].pos=this.value;saveDraft();render()" onblur="render()">';
 if(it.actual!==''&&it.actual!=null&&it.pos!==''&&it.pos!=null){var d=Number(it.actual)-Number(it.pos);h+='<div class="'+(d?'warn':'ok')+'" style="margin-top:8px">'+t('diff')+': '+(d>0?'+':'')+d+'</div>';
  if(d)h+='<input type="number" placeholder="'+t('recount')+'" value="'+esc(it.recount||'')+'" oninput="S.v.items['+v.idx+'].recount=this.value;saveDraft()"><textarea placeholder="'+t('diffnote')+'" oninput="S.v.items['+v.idx+'].note=this.value;saveDraft()">'+esc(it.note||'')+'</textarea>';}
 h+='</div>';var g=(v.answers['g_'+v.idx]||{}).photoIds||[],p=(v.answers['p_'+v.idx]||{}).photoIds||[];
 var ok=g.length&&p.length&&it.actual!==''&&it.actual!=null&&it.pos!==''&&it.pos!=null&&(Number(it.actual)===Number(it.pos)||(it.recount!==undefined&&it.recount!==''&&(it.note||'').trim()));
 return h+'<div class="row"><button class="btn btn2" onclick="spotGo(-1)">'+t('back')+'</button><button class="btn" onclick="spotGo(1,'+(ok?1:0)+')">'+t('next')+'</button></div>';}
function spotGo(d,ok){if(d>0&&!ok)return toast(t('needAll'));S.v.idx=Math.max(0,S.v.idx+d);saveDraft();render();}
function spotEnd(){var v=S.v,same=v.items.filter(function(i){return Number(i.actual)===Number(i.pos)}).length;
 var h='<div class="card"><h2>'+same+'/'+v.items.length+' '+t('spotDone')+'</h2>'+v.items.map(function(i,k){var d=Number(i.actual)-Number(i.pos);return d?'<div class="small warn" onclick="S.v.idx='+k+';render()">'+esc(i.name)+': '+(d>0?'+':'')+d+'</div>':''}).join('')+'</div>';
 h+='<div class="card">'+photoBlock('outselfie',t('outselfie'),1,true,v.endSelfieIds)+'<div class="small" style="margin-top:8px">'+geoLine()+'</div></div>';var n=pending();if(n)h+='<div class="card warn">'+t('waitUp')+' ('+n+')</div>';
 return h+'<button class="btn" '+((v.endSelfieIds||[]).length&&!n?'':'disabled')+' onclick="submitSpot()">'+t('submit')+'</button><button class="btn btn2" onclick="spotGo(-1)">'+t('back')+'</button>';}
function submitSpot(){var v=S.v;if(pending())return toast(t('waitUp'));if(mins()<30&&!confirm(t('minTime')))return;
 var p={visitId:v.visitId,storeId:v.storeId,startTime:v.startTime,startDist:v.startDist,startSelfie:(v.startSelfieIds||[]).map(murl).join('\n'),endSelfie:(v.endSelfieIds||[]).map(murl).join('\n'),
  items:v.items.map(function(i,k){return {sku:i.sku,name:i.name,shared:i.shared,actual:i.actual,pos:i.pos,recount:i.recount||'',note:i.note||'',goodsPhoto:((v.answers['g_'+k]||{}).photoIds||[]).map(murl).join('\n'),posPhoto:((v.answers['p_'+k]||{}).photoIds||[]).map(murl).join('\n')}})};
 busyOn(t('submitting'));run('submitSpot',[S.token,p],function(r){busyOff();localStorage.removeItem(DRAFT_KEY);S.v=null;document.getElementById('app').innerHTML='<div class="card"><h2>✓ '+t('done')+'</h2><div>'+r.same+'/'+r.count+' '+t('spotDone')+'</div><div class="small">'+Math.round(r.minutes)+' '+t('minutes')+(r.flags.length?' · <span class="warn">'+esc(r.flags.join(', '))+'</span>':'')+'</div><button class="btn" onclick="render()">'+t('home')+'</button></div>';},function(e){busyOff();toast(t('err')+': '+e);});}

window.addEventListener('beforeunload',function(e){if(S.v&&pending()){e.preventDefault();e.returnValue='';}});
render();
</script></body></html>
